<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>漢字小テスト作成ツール</title>
<style>
  :root{
    --border:#222;
    --muted:#666;
    --bg:#f4f4f4;
    --panel:#fff;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:"Yu Gothic","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    background:var(--bg);
    color:#111;
  }
  header{
    padding:14px 18px;
    border-bottom:1px solid #ccc;
    background:#fff;
    position:sticky;
    top:0;
    z-index:5;
  }
  header h1{font-size:20px;margin:0 0 8px}
  header .sub{font-size:12px;color:var(--muted)}
  .app{
    display:grid;
    grid-template-columns:minmax(420px, 42%) 1fr;
    gap:14px;
    padding:14px;
    align-items:start;
    height:calc(100vh - 78px);
    overflow:hidden;
  }
  .panel{
    background:var(--panel);
    border:1px solid #ccc;
    padding:12px;
    border-radius:8px;
  }
  .editor-side{
    height:100%;
    overflow-y:auto;
    overflow-x:hidden;
    overscroll-behavior:contain;
  }
  .preview-side{
    height:100%;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    position:sticky;
    top:78px;
  }
  .preview-side .toolbar{
    flex:0 0 auto;
  }
  .preview-side .preview-wrap{
    flex:1 1 auto;
    overflow:auto;
    min-height:0;
  }
  .panel h2{font-size:12px;margin:0 0 10px}
  label{font-size:13px;font-weight:700}
  input[type=text], textarea, select{
    width:100%;
    border:1px solid #aaa;
    border-radius:4px;
    padding:8px;
    font:inherit;
    background:#fff;
  }
  textarea{
    min-height:160px;
    resize:vertical;
    line-height:1.6;
  }
  .row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:8px;
  }
  .row-3{
    display:grid;
    grid-template-columns:1.2fr .8fr 1fr;
    gap:8px;
    margin-bottom:8px;
  }
  .btns{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
  button,.file-btn{
    border:1px solid #333;
    background:#fff;
    color:#111;
    border-radius:5px;
    padding:8px 11px;
    cursor:pointer;
    font-weight:700;
    font-size:13px;
  }
  button:hover,.file-btn:hover{background:#eee}
  button.primary{background:#111;color:#fff}
  button.danger{border-color:#900;color:#900}
  .file-btn input{display:none}
  .help{
    font-size:12px;
    color:#555;
    line-height:1.6;
    background:#fafafa;
    padding:8px;
    border-left:3px solid #777;
    margin:8px 0 12px;
  }
  .question-editor{
    border-top:1px solid #ddd;
    padding-top:10px;
    margin-top:10px;
  }
  .qcard{
    border:1px solid #bbb;
    border-radius:7px;
    padding:10px;
    margin:8px 0;
    background:#fff;
  }
  .qhead{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:8px;
  }
  .qactions{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
  }
  .qactions button{
    padding:5px 8px;
    font-size:12px;
  }
  .warnbox{
    display:none;
    margin:10px 0;
    border:1px solid #a33;
    background:#fff7f7;
    padding:8px 10px;
    border-radius:5px;
    font-size:12px;
    line-height:1.6;
  }
  .warnbox.show{display:block}
  .warnbox strong{color:#900}
  .date-input-print{
    writing-mode:horizontal-tb;
    text-orientation:mixed;
    font-size:12px;
    border:none;
    outline:none;
    width:18mm;
    background:transparent;
    text-align:center;
  }
  .qnum{font-weight:800}
  .sentence-select{
    line-height:2;
    border:1px solid #ddd;
    padding:8px;
    border-radius:4px;
    min-height:46px;
    user-select:none;
    cursor:default;
  }
  .char{
    display:inline-block;
    min-width:.9em;
    text-align:center;
    padding:0 1px;
    border-radius:2px;
  }
  .char:hover{background:#eee}
  .char.focus{outline:2px solid #777}
  .char.selected{
    font-weight:900;
    text-decoration:underline;
    background:#eee;
  }
  .range-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:8px;
  }
  .mini{font-size:11px;color:#666;margin-top:5px}
  .preview-wrap{
    overflow:auto;
    background:#d9d9d9;
    padding:12px;
    border-radius:8px;
    min-height:0;
  }
  #sheetHost{
    position:relative;
    margin:auto;
  }
  #sheetHost > .sheet{
    position:absolute;
    top:0;
    left:0;
    transform-origin:top left;
  }
  .sheet{
    width:297mm;
    min-height:210mm;
    background:#fff;
    margin:auto;
    padding:8mm 8mm;
    box-shadow:0 1px 8px rgba(0,0,0,.2);
    position:relative;
    display:flex;
    flex-direction:row-reverse;
    gap:4mm;
    overflow:hidden;
  }
  .meta-column{
    width:25mm;
    border-left:1px solid #222;
    padding-left:3mm;
    writing-mode:vertical-rl;
    text-orientation:mixed;
    display:flex;
    gap:4mm;
    align-items:flex-start;
  }
  .meta-title{
    font-size:18px;
    font-weight:800;
    letter-spacing:.08em;
  }
  .meta-box{
    display:flex;
    align-items:center;
    gap:3mm;
    font-size:14px;
  }
  .blank-box{
    display:inline-block;
    border:1.3px solid #111;
    background:#fff;
  }
  .date-box{
    width:11mm;
    height:24mm;
  }
  .name-box{
    width:16mm;
    height:46mm;
  }
  .score-box{
    writing-mode:horizontal-tb;
    text-orientation:mixed;
    border:1.3px solid #111;
    min-width:18mm;
    padding:3px 5px;
    font-weight:700;
    text-align:center;
  }
  .questions-area{
    flex:1;
    display:flex;
    flex-direction:row-reverse;
    align-items:flex-start;
    gap:2.2mm;
    overflow:hidden;
  }
  .test-item{
    width:14mm;
    min-height:170mm;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    gap:2mm;
    break-inside:avoid;
  }
  .qvertical{
    writing-mode:vertical-rl;
    text-orientation:mixed;
    font-size:13px;
    line-height:1.45;
    height:128mm;
    overflow:hidden;
    position:relative;
  }
  .qvertical .problem-mark{
    position:relative;
    display:inline-block;
    padding-right:4px;
    font-weight:900;
  }
  .qvertical .problem-mark::after{
    content:"";
    position:absolute;
    top:0;
    bottom:0;
    right:0;
    width:2px;
    background:#111;
  }
  .answer-rect{
    width:12mm;
    height:27mm;
    border:1.4px solid #111;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    writing-mode:vertical-rl;
    text-orientation:mixed;
    overflow:hidden;
    padding:2mm;
  }
  .qno{
    font-size:11px;
    font-weight:800;
    margin-bottom:0.5mm;
  }
  .empty{
    color:#777;
    font-size:14px;
    writing-mode:horizontal-tb;
    margin:auto;
  }
  .toolbar{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    align-items:center;
    margin-bottom:10px;
  }
  .status{font-size:12px;color:#555}
  @page{
    size:A4 landscape;
    margin:0;
  }
  @media print{
    body{background:#fff}
    header,.editor-side,.toolbar{display:none!important}
    .app{display:block;padding:0;height:auto;overflow:visible}
    .panel.preview-side{
      border:none;
      padding:0;
      margin:0;
      border-radius:0;
      height:auto;
      overflow:visible;
      position:static;
      display:block;
    }
    .preview-wrap{
      padding:0;
      margin:0;
      background:#fff;
      overflow:visible;
    }
    #sheetHost{
      width:auto!important;
      height:auto!important;
      margin:0!important;
      position:static!important;
    }
    #sheetHost > .sheet{
      position:relative!important;
      transform:none!important;
      top:auto!important;
      left:auto!important;
    }
    .sheet{
      box-shadow:none;
      margin:0;
      width:297mm;
      min-height:210mm;
      page-break-after:always;
    }
  }
  @media (max-width:1000px){
    .app{
      grid-template-columns:1fr;
      height:auto;
      overflow:visible;
    }
    .editor-side,
    .preview-side{
      height:auto;
      overflow:visible;
      position:static;
    }
    .preview-side .preview-wrap{
      max-height:70vh;
      overflow:auto;
    }
  }

  /* ===== 印刷専用：プレビュー用の固定・スクロール・縮小を完全解除 ===== */
  @media print {
    html, body {
      width: 297mm !important;
      height: 210mm !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: visible !important;
      background: #fff !important;
    }

    header,
    .editor-side,
    .toolbar,
    .warnbox {
      display: none !important;
    }

    .app {
      display: block !important;
      width: 297mm !important;
      height: 210mm !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: visible !important;
    }

    .panel.preview-side {
      display: block !important;
      position: static !important;
      width: 297mm !important;
      height: 210mm !important;
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
      border-radius: 0 !important;
      overflow: visible !important;
    }

    .preview-side .preview-wrap,
    .preview-wrap {
      display: block !important;
      position: static !important;
      width: 297mm !important;
      height: 210mm !important;
      max-width: none !important;
      max-height: none !important;
      min-height: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: visible !important;
      background: #fff !important;
      border-radius: 0 !important;
    }

    #sheetHost {
      display: block !important;
      position: static !important;
      width: 297mm !important;
      height: 210mm !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: visible !important;
    }

    #sheetHost > .sheet,
    .sheet {
      display: flex !important;
      position: static !important;
      width: 297mm !important;
      height: 210mm !important;
      min-height: 210mm !important;
      max-height: 210mm !important;
      margin: 0 !important;
      padding: 10mm 11mm !important;
      box-shadow: none !important;
      transform: none !important;
      transform-origin: initial !important;
      overflow: hidden !important;
      page-break-after: avoid !important;
      break-after: avoid-page !important;
    }
  }

</style>
</head>
<body>
<header>
  <h1>漢字小テスト作成ツール Ver.11</h1>
  <div class="sub">HTML単体 / 問題データは自動保存しません / JSON保存・読込対応</div>
</header>

<div class="app">
  <section class="panel editor-side">
    <h2>1. 基本設定</h2>
    <div class="row-3">
      <div>
        <label for="titleInput">タイトル</label>
        <input id="titleInput" type="text" placeholder="未入力なら「漢字小テスト」">
      </div>
      <div>
        <label for="gradeInput">学年</label>
        <select id="gradeInput">
          <option value="">未選択</option>
          <option>小4</option>
          <option>小5</option>
          <option>小6</option>
          <option>中1</option>
          <option>中2</option>
          <option>中3</option>
        </select>
      </div>
      <div>
        <label for="dateInput">実施日（任意）</label>
        <input id="dateInput" type="text" placeholder="例：9月5日">
      </div>
    </div>
    <div class="row">
      <div>
        <label for="suffixInput">保存ファイル名の追記</label>
        <input id="suffixInput" type="text" placeholder="例：2学期第1回">
      </div>
      <div>
        <label>&nbsp;</label>
        <div class="mini">実施日は未入力なら用紙上も空欄です。</div>
      </div>
    </div>

    <label for="bulkInput">問題文（一括入力・改行＝1問）</label>
    <textarea id="bulkInput" placeholder="例：
環境問題は深刻だ。
日本の文化を学ぶ。
友達と公園へ行く。"></textarea>

    <div class="btns">
      <button class="primary" id="applyBulk">問題に反映</button>
      <button id="saveJson">JSON保存</button>
      <label class="file-btn">JSON読込<input id="loadJson" type="file" accept=".json,application/json"></label>
      <button class="danger" id="clearAll">全消去</button>
    </div>

    <div class="btns" aria-label="全問の出題形式を一括変更">
      <strong style="align-self:center;font-size:13px">全問一括：</strong>
      <button type="button" id="allReading">すべて「読み」にする</button>
      <button type="button" id="allWriting">すべて「書き」にする</button>
    </div>

    <div class="help">
      出題箇所は、各問題の文字をクリックして開始位置・終了位置を決めます。<br>
      キーボード操作では、文字をTabで選び、Enter/Spaceで開始・終了を指定できます。
      1問につき出題箇所は1か所です。読み問題で選択範囲がかなだけの場合、または書き問題で選択範囲が漢字だけの場合は、正答を自動登録します。
    </div>

    <div id="warningBox" class="warnbox"></div>
    <div class="question-editor">
      <h2>2. 問題ごとの設定</h2>
      <div id="questionCards"></div>
    </div>
  </section>

  <section class="panel preview-side">
    <div class="toolbar">
      <strong>3. プレビュー</strong>
      <button id="showProblem" class="primary">問題</button>
      <button id="showAnswer">解答</button>
      <button id="printCurrent">現在表示を印刷</button>
      <button id="printProblem">問題を印刷</button>
      <button id="printAnswer">解答を印刷</button>
      <span class="status" id="previewStatus"></span>
    </div>
    <div class="preview-wrap">
      <div id="sheetHost"></div>
    </div>
  </section>
</div>

<script>
(() => {
  const state = {
    title: "",
    suffix: "",
    mode: "problem",
    questions: []
  };

  const $ = (id) => document.getElementById(id);
  const titleInput = $("titleInput");
  const gradeInput = $("gradeInput");
  const dateInput = $("dateInput");
  const suffixInput = $("suffixInput");
  const bulkInput = $("bulkInput");
  const cards = $("questionCards");
  const sheetHost = $("sheetHost");
  const status = $("previewStatus");

  function normalizeQuestion(text){
    return {
      text,
      start: null,
      end: null,
      type: "reading",
      answer: "",
      cue: "",
      pickStage: 0
    };
  }

  function escapeHtml(s){
    return String(s)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;");
  }

  function applyBulk(){
    const lines = bulkInput.value
      .split(/\r?\n/)
      .map(v => v.trim())
      .filter(Boolean);

    const old = state.questions;
    state.questions = lines.map((text, i) => {
      if(old[i] && old[i].text === text) return old[i];
      return normalizeQuestion(text);
    });
    renderAll();
  }

  function titleText(){
    return titleInput.value.trim() || "漢字小テスト";
  }

  function selectedText(q){
    if(q.start == null || q.end == null) return "";
    const a = Math.min(q.start, q.end);
    const b = Math.max(q.start, q.end);
    return [...q.text].slice(a,b+1).join("");
  }


  function isKanaOnly(text){
    return !!text && /^[\p{Script=Hiragana}\p{Script=Katakana}ー・]+$/u.test(text);
  }

  function isKanjiOnly(text){
    return !!text && /^[\p{Script=Han}々〆ヵヶ]+$/u.test(text);
  }

  function autoFillAnswer(q){
    const target = selectedText(q);
    if(!target) return false;
    if(q.type === "reading" && isKanaOnly(target)){
      q.answer = target;
      return true;
    }
    if(q.type === "writing" && isKanjiOnly(target)){
      q.answer = target;
      return true;
    }
    return false;
  }

  function setAllTypes(type){
    state.questions.forEach(q => {
      q.type = type;
      autoFillAnswer(q);
    });
    renderAll();
  }

  function setPoint(qIndex, charIndex){
    const q = state.questions[qIndex];
    if(q.pickStage === 0 || q.start == null || q.end != null){
      q.start = charIndex;
      q.end = null;
      q.pickStage = 1;
    }else{
      q.end = charIndex;
      if(q.end < q.start){
        const t = q.start; q.start = q.end; q.end = t;
      }
      q.pickStage = 0;
      autoFillAnswer(q);
    }
    renderCards();
    renderPreview();
  }


  function toKatakanaOnly(value){
    let s = String(value || "");
    // ひらがなをカタカナへ変換
    s = s.replace(/[\u3041-\u3096]/g, ch =>
      String.fromCharCode(ch.charCodeAt(0) + 0x60)
    );
    // カタカナ・長音・中点・空白以外を除去
    s = s.replace(/[^\u30A1-\u30FA\u30FC\u30FB\u30FD\u30FE\s]/g, "");
    return s;
  }

  function renderCards(){
    cards.innerHTML = "";
    if(!state.questions.length){
      cards.innerHTML = '<div class="mini">まだ問題がありません。</div>';
      return;
    }

    state.questions.forEach((q, qi) => {
      const card = document.createElement("div");
      card.className = "qcard";
      const chars = [...q.text];

      const sentence = chars.map((ch, ci) => {
        const selected = q.start != null && q.end != null && ci >= q.start && ci <= q.end;
        const singlePending = q.start != null && q.end == null && ci === q.start;
        const cls = "char" + (selected || singlePending ? " selected" : "");
        return `<span class="${cls}" tabindex="0" data-q="${qi}" data-c="${ci}" aria-label="${ci+1}文字目 ${escapeHtml(ch)}">${escapeHtml(ch === " " ? "　" : ch)}</span>`;
      }).join("");

      card.innerHTML = `
        <div class="qhead">
          <span class="qnum">第${qi+1}問</span>
          <div class="qactions">
            <button type="button" data-action="move-up" data-q="${qi}" ${qi===0?"disabled":""}>↑</button>
            <button type="button" data-action="move-down" data-q="${qi}" ${qi===state.questions.length-1?"disabled":""}>↓</button>
            <button type="button" data-action="clear-range" data-q="${qi}">指定解除</button>
          </div>
        </div>
        <div class="sentence-select" aria-label="第${qi+1}問 出題箇所指定">${sentence}</div>
        <div class="mini">
          ${q.start == null ? "開始位置を指定してください。" :
            q.end == null ? "開始位置を指定済み。終了位置を指定してください。" :
            `出題箇所：${escapeHtml(selectedText(q))}`}
        </div>
        <div class="range-row">
          <div>
            <label>出題形式</label>
            <select data-field="type" data-q="${qi}">
              <option value="reading" ${q.type==="reading"?"selected":""}>読み</option>
              <option value="writing" ${q.type==="writing"?"selected":""}>書き</option>
            </select>
          </div>
          <div>
            <label>正答</label>
            <input type="text" data-field="answer" data-q="${qi}" value="${escapeHtml(q.answer)}" placeholder="例：カンキョウ（ひらがな入力も自動変換）">
          </div>
        </div>
        <div style="margin-top:8px">
          <label>${q.type==="writing" ? "問題用の読み表記（カタカナのみ）" : "読み問題では未使用"}</label>
          <input type="text" data-field="cue" data-q="${qi}" value="${escapeHtml(q.cue)}"
            placeholder="${q.type==="writing" ? "例：カンキョウ（ひらがな入力も自動変換）" : "読み問題では空欄でOK"}" ${q.type==="reading" ? "disabled" : ""}>
        </div>
      `;
      cards.appendChild(card);
    });

    cards.querySelectorAll(".char").forEach(el => {
      el.addEventListener("click", () => setPoint(+el.dataset.q, +el.dataset.c));
      el.addEventListener("keydown", (e) => {
        if(e.key === "Enter" || e.key === " "){
          e.preventDefault();
          setPoint(+el.dataset.q, +el.dataset.c);
        }
      });
    });

    cards.querySelectorAll("[data-field]").forEach(el => {
      const field = el.dataset.field;

      if(field === "cue"){
        // 入力中は一切変換しない。確定操作のときだけまとめてカタカナ化する。
        const commitCue = () => {
          const q = state.questions[+el.dataset.q];
          const converted = toKatakanaOnly(el.value);
          el.value = converted;
          q.cue = converted;
          renderPreview();
        };

        el.addEventListener("input", () => {
          const q = state.questions[+el.dataset.q];
          // IME入力中も含め、表示されている文字列をそのまま一時保持。
          q.cue = el.value;
        });

        // Enterで確定
        el.addEventListener("keydown", (e) => {
          if(e.key === "Enter" && !e.isComposing){
            e.preventDefault();
            commitCue();
            el.blur();
          }
        });

        // Tab移動・マウスクリックなどで欄を離れたときに確定
        el.addEventListener("blur", () => {
          commitCue();
        });

        // 貼り付けも、貼った直後ではなく欄を離れるまでは変換しない
      } else {
        el.addEventListener("input", () => {
          const q = state.questions[+el.dataset.q];
          q[field] = el.value;

          if(field === "type"){
            autoFillAnswer(q);
            if(q.type === "writing"){
              q.cue = toKatakanaOnly(q.cue);
            }
            renderCards();
          }
          renderPreview();
        });
      }
    });

    cards.querySelectorAll('[data-action="move-up"]').forEach(el => {
      el.addEventListener("click", () => {
        const i = +el.dataset.q;
        if(i <= 0) return;
        [state.questions[i-1], state.questions[i]] = [state.questions[i], state.questions[i-1]];
        bulkInput.value = state.questions.map(q => q.text).join("\n");
        renderAll();
      });
    });

    cards.querySelectorAll('[data-action="move-down"]').forEach(el => {
      el.addEventListener("click", () => {
        const i = +el.dataset.q;
        if(i >= state.questions.length - 1) return;
        [state.questions[i+1], state.questions[i]] = [state.questions[i], state.questions[i+1]];
        bulkInput.value = state.questions.map(q => q.text).join("\n");
        renderAll();
      });
    });

    cards.querySelectorAll('[data-action="clear-range"]').forEach(el => {
      el.addEventListener("click", () => {
        const q = state.questions[+el.dataset.q];
        q.start = q.end = null;
        q.pickStage = 0;
        renderCards();
        renderPreview();
      });
    });
  }

  function problemTextParts(q){
    const chars = [...q.text];
    if(q.start == null || q.end == null) {
      return [{text:q.text, mark:false}];
    }
    const before = chars.slice(0,q.start).join("");
    const target = chars.slice(q.start,q.end+1).join("");
    const after = chars.slice(q.end+1).join("");
    const shown = q.type === "writing" ? (q.cue || target) : target;
    return [
      {text:before, mark:false},
      {text:shown, mark:true},
      {text:after, mark:false}
    ];
  }


  function collectWarnings(){
    const warnings = [];
    state.questions.forEach((q, i) => {
      const no = i + 1;
      if(!q.text || !q.text.trim()) warnings.push(`第${no}問：問題文が空欄です。`);
      if(q.start == null || q.end == null) warnings.push(`第${no}問：出題箇所が未指定です。`);
      if(!q.answer || !q.answer.trim()) warnings.push(`第${no}問：正答が未入力です。`);
      if(q.type === "writing" && (!q.cue || !q.cue.trim())) {
        warnings.push(`第${no}問：書き問題の読み表記が未入力です。`);
      }
    });
    return warnings;
  }

  function renderWarnings(){
    const box = $("warningBox");
    const warnings = collectWarnings();
    if(!warnings.length){
      box.classList.remove("show");
      box.innerHTML = "";
      return;
    }
    box.classList.add("show");
    box.innerHTML = `<strong>印刷前チェック</strong><br>${warnings.map(w => "・" + escapeHtml(w)).join("<br>")}`;
  }

  function sheetHtml(mode){
    const items = state.questions.map((q, i) => {
      const parts = problemTextParts(q);
      const sentence = parts.map(p => p.mark
        ? `<span class="problem-mark">${escapeHtml(p.text)}</span>`
        : escapeHtml(p.text)
      ).join("");
      const ans = mode === "answer" ? escapeHtml(q.answer || "（未入力）") : "";
      return `
        <div class="test-item">
          <div class="qno">${i+1}</div>
          <div class="qvertical">${sentence}</div>
          <div class="answer-rect">${ans}</div>
        </div>`;
    }).join("");

    const count = state.questions.length;
    return `
      <div class="sheet">
        <div class="meta-column">
          <div class="meta-title">${escapeHtml(titleText())}</div>
          ${gradeInput.value ? `<div class="meta-box">学年 <span class="score-box">${escapeHtml(gradeInput.value)}</span></div>` : ""}
          <div class="meta-box">実施日 ${
            dateInput.value.trim()
              ? `<span class="score-box">${escapeHtml(dateInput.value.trim())}</span>`
              : `<span class="blank-box date-box"></span>`
          }</div>
          <div class="meta-box">氏名 <span class="blank-box name-box"></span></div>
          <div class="meta-box">点数 <span class="score-box">　／${count}</span></div>
        </div>
        <div class="questions-area">
          ${items || '<div class="empty">問題文を入力してください。</div>'}
        </div>
      </div>`;
  }


  function fitPreviewToPane(){
    const wrap = document.querySelector(".preview-wrap");
    const host = sheetHost;
    const sheet = host.querySelector(".sheet");
    if(!wrap || !sheet) return;

    // Reset before measuring the true A4 size.
    sheet.style.transform = "none";
    host.style.width = "";
    host.style.height = "";

    const sheetW = sheet.offsetWidth;
    const sheetH = sheet.offsetHeight;
    const availW = Math.max(100, wrap.clientWidth - 20);
    const availH = Math.max(100, wrap.clientHeight - 20);

    const scale = Math.min(availW / sheetW, availH / sheetH, 1);

    sheet.style.transform = `scale(${scale})`;
    host.style.width = `${sheetW * scale}px`;
    host.style.height = `${sheetH * scale}px`;
  }

  function renderPreview(){
    sheetHost.innerHTML = sheetHtml(state.mode);
    status.textContent = state.mode === "problem" ? "問題表示中" : "解答表示中";
    $("showProblem").classList.toggle("primary", state.mode === "problem");
    $("showAnswer").classList.toggle("primary", state.mode === "answer");
    renderWarnings();
    requestAnimationFrame(fitPreviewToPane);
  }

  function renderAll(){
    renderCards();
    renderPreview();
  }

  function dateStamp(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");
    return `${y}${m}${day}`;
  }

  function saveJson(){
    const payload = {
      version: 1,
      title: titleInput.value,
      grade: gradeInput.value,
      date: dateInput.value,
      suffix: suffixInput.value,
      questions: state.questions.map(({pickStage,...q}) => q)
    };
    const suffix = suffixInput.value.trim().replace(/[\\/:*?"<>|]/g,"_");
    const filename = `漢字テスト_${dateStamp()}${suffix ? "_" + suffix : ""}.json`;
    const blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }

  async function loadJson(file){
    try{
      const text = await file.text();
      const obj = JSON.parse(text);
      titleInput.value = obj.title || "";
      gradeInput.value = obj.grade || "";
      dateInput.value = obj.date || "";
      suffixInput.value = obj.suffix || "";
      state.questions = Array.isArray(obj.questions)
        ? obj.questions.map(q => {
            const merged = {...normalizeQuestion(q.text || ""), ...q, pickStage:0};
            if(merged.type === "writing"){
              merged.cue = toKatakanaOnly(merged.cue);
            }
            return merged;
          })
        : [];
      bulkInput.value = state.questions.map(q => q.text).join("\n");
      renderAll();
    }catch(e){
      alert("JSONファイルを読み込めませんでした。");
    }
  }

  function clearAll(){
    if(!confirm("本当にすべて削除しますか？")) return;
    titleInput.value = "";
    gradeInput.value = "";
    dateInput.value = "";
    suffixInput.value = "";
    bulkInput.value = "";
    state.questions = [];
    state.mode = "problem";
    renderAll();
  }

  function ensureReadyToPrint(){
    const warnings = collectWarnings();
    if(!warnings.length) return true;
    return confirm("未入力・未設定の項目があります。\n\n" + warnings.join("\n") + "\n\nこのまま印刷しますか？");
  }

  function printMode(mode){
    if(!ensureReadyToPrint()) return;
    const old = state.mode;
    state.mode = mode;
    renderPreview();
    setTimeout(() => {
      window.print();
      state.mode = old;
      renderPreview();
    }, 50);
  }

  $("applyBulk").addEventListener("click", applyBulk);
  $("allReading").addEventListener("click", () => setAllTypes("reading"));
  $("allWriting").addEventListener("click", () => setAllTypes("writing"));
  $("saveJson").addEventListener("click", saveJson);
  $("loadJson").addEventListener("change", e => {
    if(e.target.files?.[0]) loadJson(e.target.files[0]);
    e.target.value = "";
  });
  $("clearAll").addEventListener("click", clearAll);
  $("showProblem").addEventListener("click", () => {state.mode="problem"; renderPreview();});
  $("showAnswer").addEventListener("click", () => {state.mode="answer"; renderPreview();});
  $("printCurrent").addEventListener("click", () => {
    if(ensureReadyToPrint()) window.print();
  });
  $("printProblem").addEventListener("click", () => printMode("problem"));
  $("printAnswer").addEventListener("click", () => printMode("answer"));
  titleInput.addEventListener("input", renderPreview);
  gradeInput.addEventListener("change", renderPreview);
  dateInput.addEventListener("input", renderPreview);
  window.addEventListener("resize", () => requestAnimationFrame(fitPreviewToPane));

  renderAll();
})();
</script>
</body>
</html>
